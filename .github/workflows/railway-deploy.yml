name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_API_TOKEN }}
  DEFAULT_RAILWAY_FRONTEND_SERVICE: frontend
  DEFAULT_RAILWAY_BACKEND_SERVICE: backend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway config
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Missing Railway token. Set repository secret RAILWAY_TOKEN or RAILWAY_API_TOKEN."
            exit 1
          fi
          service="${RAILWAY_FRONTEND_SERVICE:-$DEFAULT_RAILWAY_FRONTEND_SERVICE}"
          echo "RAILWAY_FRONTEND_SERVICE=$service" >> "$GITHUB_ENV"
        env:
          RAILWAY_FRONTEND_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE }}

      - name: Deploy frontend
        run: railway up ./frontend --path-as-root --service "$RAILWAY_FRONTEND_SERVICE" --detach

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway config
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Missing Railway token. Set repository secret RAILWAY_TOKEN or RAILWAY_API_TOKEN."
            exit 1
          fi
          service="${RAILWAY_BACKEND_SERVICE:-$DEFAULT_RAILWAY_BACKEND_SERVICE}"
          echo "RAILWAY_BACKEND_SERVICE=$service" >> "$GITHUB_ENV"
        env:
          RAILWAY_BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}

      - name: Deploy backend
        run: railway up ./backend --path-as-root --service "$RAILWAY_BACKEND_SERVICE" --detach
